import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.11'
    id("io.freefair.lombok") version "8.14"
    id 'com.lukittu.sdk' version 'v1.0.10-local'
    id 'net.exylia.release-tools' version '1.0.0-local'
}

def pluginName = 'ExyliaClasses'
def mainPackage = 'net.exylia'
def fullPackage = "${mainPackage}.exyliaClasses"
def outputDirectory = "/root/Java/jars"

group = mainPackage
version = 'v1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-snapshots/") }
}

/**
 * ExyliaLib is always consumed at its newest release.
 *
 * It sits in its own configuration so the version it resolved to can be read
 * back without resolving the whole compile classpath. That readback is the
 * point: the Lukittu loader needs to be told which ExyliaLib this jar expects,
 * and typing that number a second time is how the two drift apart.
 *
 * Dynamic versions are cached for 24 hours by default, which would keep a build
 * compiling against yesterday's library after a new one is published. "Always
 * the latest" has to mean this build, not the one after the cache expires.
 */
configurations {
    exyliaLib
    compileOnly.extendsFrom(exyliaLib)
}

configurations.configureEach {
    resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

dependencies {
    exyliaLib 'net.exylia:ExyliaLib:latest.release'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'
    compileOnly 'com.lukittu.loader:lukittu-common:v1.0.10-local'
    compileOnly 'com.lukittu.loader:lukittu-spigot:v1.0.10-local'
    compileOnly 'com.github.ben-manes.caffeine:caffeine:3.2.2'
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    compileOnly 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
    compileOnly 'io.github.revxrsal:lamp.brigadier:4.0.0-rc.17'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveBaseName.set(pluginName)
    archiveClassifier.set('')
    destinationDirectory = file("/root/Java/jars/plugins")
    minimize()
    exclude 'com/lukittu/**'
}

tasks.register('cleanTarget', Delete) {
    delete 'target/'
}

clean.dependsOn cleanTarget

tasks.register('buildAll') {
    dependsOn clean, shadowJar
    group = 'build'
    description = 'Builds the plugin JAR and the Lukittu loader JAR'
    doLast {
        exec {
            workingDir project.rootDir
            commandLine System.getProperty("os.name").toLowerCase().contains("windows") ? ['cmd', '/c', 'gradlew.bat', 'assembleLoaderJar'] : ['./gradlew', 'assembleLoaderJar']
        }
    }
}

/**
 * The exact ExyliaLib this jar was compiled against.
 *
 * Resolved lazily rather than at configuration time so that a task which does
 * not need it (clean, the release tasks) never pays for the lookup, and so a
 * network hiccup cannot fail configuration of the whole build.
 *
 * This is what feeds the loader below. Anything else — a literal, a separate
 * property — is a second place to state the same fact, and the two go out of
 * sync silently: this plugin used to compile against 1.18.3 while telling the
 * loader 1.17.2 was enough, so a server running 1.17.2 was cleared to start and
 * then died on NoSuchMethodError in front of a player.
 */
def resolvedExyliaLibVersion = provider {
    configurations.exyliaLib.resolvedConfiguration
            .resolvedArtifacts
            .find { it.moduleVersion.id.name == 'ExyliaLib' }
            ?.moduleVersion?.id?.version
            ?: { throw new GradleException('ExyliaLib did not resolve — is it published?') }()
}

lukittu {
    platform.set('spigot')
    mainClass.set('net.exylia.exyliaClasses.ExyliaClasses')
    productId.set('64c9a438-3ec2-4cdb-8540-eebdc6a984c5')
    teamId.set('824ea588-c7b2-4cf3-b9af-25cff6b5385c')
    loaderVersion.set('v1.0.10-local')
    configHeader.set('Request your license in https://discord.exylia.net')
    lukittuBranch.set('spigot')
    devBranchId.set('95c44987-7653-46e8-8a9f-64090d309c8d')
    devLukittuBranch.set('dev')
    // Derived, never typed: see resolvedExyliaLibVersion above.
    exyliaLibVersion.set(resolvedExyliaLibVersion)
    publicKey.set('')
    outputLoaderJarPath.set("/root/Java/jars/loaders/Exylia-Classes-Loader.jar")
    resourcePaths.set([
        "src/loader/resources/plugin.yml": "plugin.yml"
    ])

    release {
        dependsOn(project.tasks.named('shadowJar'))
        injars(project.tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile })
        // Secrets live in ~/.gradle/gradle.properties, never in this repository.
        authorization.set(providers.gradleProperty('lukittuReleaseToken').orElse(''))
        status.set("PUBLISHED")
        setAsLatest.set(true)
        branchId.set("337c1c7f-5b62-4961-becd-60254f3de40f")
    }
}

exyliaRelease {
    resourceName.set(pluginName)
    bbbResourceId.set('81542')
    bbbResourceUrl.set('https://builtbybit.com/resources/exylia-classes-modern-hcf-classes-pvp.81542/')
    loaderJarPath.set("${outputDirectory}/loaders/Exylia-Classes-Loader.jar")
    discordWebhookUrl.set(providers.gradleProperty('exyliaDiscordWebhookUrl').orElse(''))
    discordColor.set(0x5865F2)
}
