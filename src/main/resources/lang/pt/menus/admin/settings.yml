# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Settings an admin tunes, one card per module. Everything else stays in the files.

title: "{primary}&lCLASSES {letters_black}» {highlight}Settings"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: COMPARATOR
    name: "<gradient:{primary}:{secondary_light}>Configurações</gradient>"
    lore:
      - "{letters_black}Configurações das classes"
      - ""
      - "{primary}✎ Informação"
      - " {letters}As barras para mudar no jogo."
      - " {letters}O resto fica nos arquivos."

  energy:
    slot: 12
    material: LIGHTNING_ROD
    name: "{letters}Configurações {letters_black}▸ <gradient:{primary}:{secondary_light}>Barra de energia</gradient>"
    lore:
      - "{letters_black}Página de configurações"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Se aparece e como fica."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Visível{letters_black}: %energy_energy_bar_enabled%"
      - "  {letters_black}· {info}{icon:star} {letters}Cor{letters_black}: %energy_energy_bar_colour%"
      - ""
      - "{primary}{icon:click} Clique para abrir"
      - "{letters_black}Cada configuração, explicada."
    actions:
      - "exyliaclasses:settings_page energy"

  mark:
    slot: 14
    material: TARGET
    name: "{letters}Configurações {letters_black}▸ <gradient:{primary}:{secondary_light}>Barra de marca</gradient>"
    lore:
      - "{letters_black}Página de configurações"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Se aparece e como fica."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Visível{letters_black}: %mark_mark_bar_enabled%"
      - "  {letters_black}· {info}{icon:star} {letters}Cor{letters_black}: %mark_mark_bar_colour%"
      - ""
      - "{primary}{icon:click} Clique para abrir"
      - "{letters_black}Cada configuração, explicada."
    actions:
      - "exyliaclasses:settings_page mark"
