      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %energy_energy_bar_colour_default%"
      - ""
      - "%energy_energy_bar_colour_click%"
    actions:
      - "exyliaclasses:setting energy energy-bar.colour"

  energy-bar-overlay:
    slot: 14
    material: CHAIN
    name: "{letters}Barra de energia {letters_black}▸ <gradient:{primary}:{secondary_light}>Segmentos</gradient>"
    lore:
      - "{letters_black}Configuração da barra de energia"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Como a barra é dividida. Barras"
      - " {letters}com cortes leem-se como pontos."
