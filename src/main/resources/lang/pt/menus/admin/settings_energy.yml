# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The energy bar settings an admin tunes.

title: "{primary}CONFIGURAÇÕES {letters_black}» {highlight}Barra de energia"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: LIGHTNING_ROD
    name: "<gradient:{primary}:{secondary_light}>Barra de energia</gradient>"
    lore:
      - "{letters_black}Configurações da barra de energia"
      - ""
      - "{primary}✎ Informação"
      - " {letters}A barra acima da hotbar que"
      - " {letters}mostra a energia da classe."

  energy-bar-enabled:
    slot: 12
    material: LEVER
    name: "{letters}Barra de energia {letters_black}▸ <gradient:{primary}:{secondary_light}>Mostrar barra</gradient>"
    lore:
      - "{letters_black}Configuração da barra de energia"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Mostra a barra de energia aos"
      - " {letters}jogadores com classe de energia."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Visível{letters_black}: %energy_energy_bar_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %energy_energy_bar_enabled_default%"
      - ""
      - "%energy_energy_bar_enabled_click%"
    actions:
      - "exyliaclasses:setting energy energy-bar.enabled"

  energy-bar-colour:
