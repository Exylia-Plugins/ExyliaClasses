    material: LEVER
    name: "{letters}Barra de energía {letters_black}▸ <gradient:{primary}:{secondary_light}>Mostrar barra</gradient>"
    lore:
      - "{letters_black}Ajuste de la barra de energía"
      - ""
      - "{primary}✎ Información"
      - " {letters}Muestra la barra de energía a los"
