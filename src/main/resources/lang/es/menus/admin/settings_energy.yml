# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The energy bar settings an admin tunes.

title: "{primary}AJUSTES {letters_black}» {highlight}Barra de energía"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: LIGHTNING_ROD
    name: "<gradient:{primary}:{secondary_light}>Barra de energía</gradient>"
    lore:
      - "{letters_black}Ajustes de la barra de energía"
      - ""
      - "{primary}✎ Información"
      - " {letters}La barra sobre la hotbar que"
      - " {letters}muestra la energía de la clase."

  energy-bar-enabled:
