      - "exyliaclasses:settings_page energy"

  mark:
    slot: 14
    material: TARGET
    name: "{letters}Paramètres {letters_black}▸ <gradient:{primary}:{secondary_light}>Barre de marque</gradient>"
    lore:
      - "{letters_black}Page de paramètres"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Son affichage et son apparence."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Visible{letters_black}: %mark_mark_bar_enabled%"
      - "  {letters_black}· {info}{icon:star} {letters}Couleur{letters_black}: %mark_mark_bar_colour%"
      - ""
      - "{primary}{icon:click} Clique pour ouvrir"
      - "{letters_black}Chaque réglage, expliqué."
    actions:
      - "exyliaclasses:settings_page mark"
