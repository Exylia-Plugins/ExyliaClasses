    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: COMPARATOR
    name: "<gradient:{primary}:{secondary_light}>Paramètres</gradient>"
    lore:
      - "{letters_black}Paramètres des classes"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Les barres à changer en jeu."
      - " {letters}Le reste reste dans les fichiers."

  energy:
    slot: 12
    material: LIGHTNING_ROD
    name: "{letters}Paramètres {letters_black}▸ <gradient:{primary}:{secondary_light}>Barre d’énergie</gradient>"
    lore:
      - "{letters_black}Page de paramètres"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Son affichage et son apparence."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Visible{letters_black}: %energy_energy_bar_enabled%"
      - "  {letters_black}· {info}{icon:star} {letters}Couleur{letters_black}: %energy_energy_bar_colour%"
      - ""
      - "{primary}{icon:click} Clique pour ouvrir"
      - "{letters_black}Chaque réglage, expliqué."
