# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The energy bar settings an admin tunes.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Energy bar"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: LIGHTNING_ROD
    name: "<gradient:{primary}:{secondary_light}>Energy bar</gradient>"
    lore:
      - "{letters_black}Energy bar settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}The bar above the hotbar that"
      - " {letters}shows a class's energy."

  energy-bar-enabled:
    slot: 12
    material: LEVER
    name: "{letters}Energy bar {letters_black}▸ <gradient:{primary}:{secondary_light}>Show bar</gradient>"
    lore:
      - "{letters_black}Energy bar setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Shows the energy bar to players"
      - " {letters}wearing a class with energy."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Shown{letters_black}: %energy_energy_bar_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %energy_energy_bar_enabled_default%"
      - ""
      - "%energy_energy_bar_enabled_click%"
    actions:
      - "exyliaclasses:setting energy energy-bar.enabled"

  energy-bar-colour:
    slot: 13
    material: YELLOW_DYE
    name: "{letters}Energy bar {letters_black}▸ <gradient:{primary}:{secondary_light}>Colour</gradient>"
    lore:
