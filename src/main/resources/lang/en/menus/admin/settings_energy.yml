      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %energy_energy_bar_colour_default%"
      - ""
      - "%energy_energy_bar_colour_click%"
    actions:
      - "exyliaclasses:setting energy energy-bar.colour"

  energy-bar-overlay:
    slot: 14
    material: CHAIN
    name: "{letters}Energy bar {letters_black}▸ <gradient:{primary}:{secondary_light}>Segments</gradient>"
    lore:
      - "{letters_black}Energy bar setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How the bar is divided. Notched"
      - " {letters}bars read as a number of pips."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Segments{letters_black}: %energy_energy_bar_overlay%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %energy_energy_bar_overlay_default%"
      - ""
      - "%energy_energy_bar_overlay_click%"
    actions:
      - "exyliaclasses:setting energy energy-bar.overlay"

