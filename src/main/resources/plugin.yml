name: ExyliaClasses
version: '${version}'
main: net.exylia.exyliaClasses.ExyliaClassesPlugin
api-version: '1.21'
authors: [ DiGround ]
website: https://github.com/Exylia-Plugins/ExyliaClasses
description: HCF PvP classes (Bard, Archer, Rogue, Miner, Tank, Sorcerer) chosen by the armour a player wears.

# Kept up to date by ExyliaLib from this repository's GitHub releases.
exylia-updates: Exylia-Plugins/ExyliaClasses
# The oldest ExyliaLib this build runs on; ExyliaLib holds back an update that needs a newer one.
exylia-lib: '${exyliaLibVersion}'

folia-supported: true

depend:
  - packetevents

softdepend:
  # Required, but soft so this plugin still starts without it: it then says where to get ExyliaLib
  # and stays off until it is installed.
  - ExyliaLib
  - PlaceholderAPI

permissions:
  exyliaclasses.admin.reload:
    description: Reload the classes and the configuration with /classes reload.
    default: op
  exyliaclasses.admin.settings:
    description: Change the settings in game with /classes settings.
    default: op
  # Classes. Each class file names the node that lets a player wear it ('permission:',
  # "NONE" for everybody). The bundled classes use exyliaclasses.class.<id>, held by
  # everybody, so a server sells a class by denying its node to the default group.
  exyliaclasses.class.archer:
    description: Wear the Archer class.
    default: true
  exyliaclasses.class.bard:
    description: Wear the Bard class.
    default: true
  exyliaclasses.class.miner:
    description: Wear the Miner class.
    default: true
  exyliaclasses.class.rogue:
    description: Wear the Rogue class.
    default: true
  exyliaclasses.class.sorcerer:
    description: Wear the Sorcerer class.
    default: true
  exyliaclasses.class.tank:
    description: Wear the Tank class.
    default: true

libraries:
  # The same list ExyliaLib declares, in the same order and the same versions.
  # The server's library loader fetches each one once and shares it, so a plugin
  # naming a driver it never opens itself costs nothing, while a plugin missing
  # one that ExyliaLib later needs is a server that starts and then cannot write.
  # Aligned on purpose: two lists that drift are how a MariaDB server ended up
  # being sent MySQL 8 syntax.
  - 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
  - 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
  - 'com.github.ben-manes.caffeine:caffeine:3.2.4'
  - 'com.zaxxer:HikariCP:5.1.0'
  - 'com.h2database:h2:2.2.224'
  - 'com.mysql:mysql-connector-j:8.4.0'
  - 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
  - 'org.postgresql:postgresql:42.7.4'
  - 'org.mongodb:mongodb-driver-sync:4.11.1'
  - 'redis.clients:jedis:5.1.0'
  - 'org.apache.commons:commons-pool2:2.12.0'
